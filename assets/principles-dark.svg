<svg xmlns="http://www.w3.org/2000/svg" width="840" height="388" viewBox="0 0 840 388" role="img" aria-label="How I work"><title>How I work</title><style>.s{font-family:'Schibsted Grotesk', Geist, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="409" height="183" rx="12" fill="#17181b" stroke="#292b2f"/><circle cx="31" cy="32" r="7" fill="none" stroke="#7896ff" stroke-width="2"/><circle cx="31" cy="32" r="3" fill="#7896ff"/><text x="386" y="37" class="m" font-size="12" fill="#5c5f65" text-anchor="end">01</text><text x="24" y="64" class="s" font-size="17" font-weight="600" letter-spacing="-.3" fill="#eff0f2">Full-stack, end to end</text><text x="24" y="92" class="s" font-size="13.5" fill="#a2a5aa">Clean architecture, databases, REST APIs, frontends</text><text x="24" y="112" class="s" font-size="13.5" fill="#a2a5aa">and Docker. I take software from the first diagram all</text><text x="24" y="132" class="s" font-size="13.5" fill="#a2a5aa">the way to production.</text><text x="24" y="162" class="m" font-size="11.5" fill="#a2a5aa" xml:space="preserve">Clean Architecture   REST APIs   Docker</text><rect x="430.5" y="0.5" width="409" height="183" rx="12" fill="#17181b" stroke="#292b2f"/><circle cx="461" cy="32" r="7" fill="none" stroke="#7896ff" stroke-width="2"/><circle cx="461" cy="32" r="3" fill="#7896ff"/><text x="816" y="37" class="m" font-size="12" fill="#5c5f65" text-anchor="end">02</text><text x="454" y="64" class="s" font-size="17" font-weight="600" letter-spacing="-.3" fill="#eff0f2">Built to optimize</text><text x="454" y="92" class="s" font-size="13.5" fill="#a2a5aa">Working software is the starting point. Then come</text><text x="454" y="112" class="s" font-size="13.5" fill="#a2a5aa">careful refactors, performance work and pipelines that</text><text x="454" y="132" class="s" font-size="13.5" fill="#a2a5aa">scale.</text><text x="454" y="162" class="m" font-size="11.5" fill="#a2a5aa" xml:space="preserve">Performance   Refactoring   CI/CD</text><rect x="0.5" y="204.5" width="409" height="183" rx="12" fill="#17181b" stroke="#292b2f"/><circle cx="31" cy="236" r="7" fill="none" stroke="#7896ff" stroke-width="2"/><circle cx="31" cy="236" r="3" fill="#7896ff"/><text x="386" y="241" class="m" font-size="12" fill="#5c5f65" text-anchor="end">03</text><text x="24" y="268" class="s" font-size="17" font-weight="600" letter-spacing="-.3" fill="#eff0f2">AI, put to work</text><text x="24" y="296" class="s" font-size="13.5" fill="#a2a5aa">RAG systems, data extraction and processing pipelines</text><text x="24" y="316" class="s" font-size="13.5" fill="#a2a5aa">that turn messy, unstructured data into something</text><text x="24" y="336" class="s" font-size="13.5" fill="#a2a5aa">useful.</text><text x="24" y="366" class="m" font-size="11.5" fill="#a2a5aa" xml:space="preserve">RAG   Data Extraction   LLMs</text><rect x="430.5" y="204.5" width="409" height="183" rx="12" fill="#17181b" stroke="#292b2f"/><circle cx="461" cy="236" r="7" fill="none" stroke="#7896ff" stroke-width="2"/><circle cx="461" cy="236" r="3" fill="#7896ff"/><text x="816" y="241" class="m" font-size="12" fill="#5c5f65" text-anchor="end">04</text><text x="454" y="268" class="s" font-size="17" font-weight="600" letter-spacing="-.3" fill="#eff0f2">Specialized models</text><text x="454" y="296" class="s" font-size="13.5" fill="#a2a5aa">When off-the-shelf models fall short, I fine-tune</text><text x="454" y="316" class="s" font-size="13.5" fill="#a2a5aa">specialized LLMs on curated datasets for domain-</text><text x="454" y="336" class="s" font-size="13.5" fill="#a2a5aa">specific precision.</text><text x="454" y="366" class="m" font-size="11.5" fill="#a2a5aa" xml:space="preserve">Fine-tuning   Datasets   Hugging Face</text></svg>
