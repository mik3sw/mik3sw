  <radialGradient id="fadeMask" cx="20%" cy="0%" r="90%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="m"><rect width="840" height="300" fill="url(#fadeMask)"/></mask>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="839" height="299" rx="12"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="839" height="299" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
<g clip-path="url(#clip)"><rect width="840" height="300" fill="url(#grid)" mask="url(#m)"/></g>

